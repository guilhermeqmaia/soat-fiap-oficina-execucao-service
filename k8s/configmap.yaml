# Variaveis NAO sensiveis. Segredo: Secret `oficina-execucao-service-app` (JWT_SECRET),
# sincronizado pelo CD. DynamoDB usa as credenciais do pod (LabRole/IRSA) — sem segredo de banco.
apiVersion: v1
kind: ConfigMap
metadata:
  name: oficina-execucao-service-config
  labels:
    {
      app.kubernetes.io/name: oficina-execucao-service,
      app.kubernetes.io/part-of: oficina-mecanica,
    }
data:
  NODE_ENV: 'production'
  PORT: '3002'
  JWT_ISSUER: 'oficina-auth-lambda'
  # Rate limiting e da borda (API Gateway, ADR-0005); atras do NLB o IP de origem e unico.
  THROTTLER_DISABLED: 'true'
  AWS_REGION: 'us-east-1'
  # Tabelas DynamoDB provisionadas pelo Terraform (repo infra-db): <prefixo>execucoes,
  # <prefixo>servicos, <prefixo>produtos, <prefixo>movimentacoes_estoque.
  DYNAMODB_TABLE_PREFIX: 'oficina-'
  # OS Service pelo DNS interno do cluster (RFC-0008): callbacks POST /ordens-servico/{numero}/eventos.
  # Chamadas entre servicos nao passam pelo API Gateway.
  OS_SERVICE_URL: 'http://oficina-app:3000'
  DD_TRACE_ENABLED: 'true'
  DD_SERVICE: 'oficina-execucao-service'
  DD_ENV: 'producao'
