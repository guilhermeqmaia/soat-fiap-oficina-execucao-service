name: CI

on:
  pull_request:
    branches: [main, homolog]
  push:
    branches: [main, homolog]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck, testes (gate 80%) e build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      - run: npm run format
      - run: npm run lint
      - run: npm run typecheck
      - name: Unitarios + cobertura
        run: npm run test:unit:cov
      - name: Integracao/e2e (DynamoDB Local via testcontainers)
        run: npm run test:integration
      - run: npm run build
      - name: OpenAPI publicado em dia com o codigo (US-F4-15)
        run: npm run openapi:export && git diff --exit-code openapi.yaml
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: coverage/unit/lcov.info, retention-days: 7 }
      - run: npm audit --omit=dev --audit-level=high

  bdd:
    name: BDD (Gherkin + Cucumber)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      - run: npm ci
      # AppModule real + DynamoDB Local (testcontainers) + OS Service fake (US-F4-14)
      - run: npm run test:bdd
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cucumber-report
          path: |
            reports/cucumber.html
            reports/cucumber.json
          retention-days: 14

  docker:
    name: Build da imagem
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t oficina-execucao-service:ci .

  sonarcloud:
    name: SonarCloud (quality gate)
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm }
      # Unit + integracao (DynamoDB Local via testcontainers): o Sonar soma os dois lcov.
      - run: npm ci && npm run test:all:cov
      - name: Analise
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v5
        env: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }
      - name: Sem SONAR_TOKEN
        if: ${{ env.SONAR_TOKEN == '' }}
        run: echo "::warning::SONAR_TOKEN ausente — analise pulada (US-F4-13)."
        env: { SONAR_TOKEN: '${{ secrets.SONAR_TOKEN }}' }
